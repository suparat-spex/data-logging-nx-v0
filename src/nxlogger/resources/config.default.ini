; NX Logger settings. Copy to config.ini (done automatically on first run) and edit.
; Values you change inside the app are remembered and take priority over this file.
; Every key is explained in docs/config.md.

[app]
theme = dark            ; dark | light | system

[mqtt]
host = broker.emqx.io
port = 1883
transport = TCP         ; TCP | TLS/SSL | WebSocket | Secure WebSocket
ws_path = /mqtt
username =
password =              ; stored in plain text - leave empty on shared PCs
client_id =             ; empty = random
keepalive = 30

[paths]
; empty = Documents\NX Logger\Recordings and ...\Projects
; relative paths are inside Documents\NX Logger
recordings =
projects =
